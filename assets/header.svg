<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Vinod Ravindu Perera — Site Reliability Engineer and Electrical &amp; Electronic Engineer</title>
  <desc id="d">Animated header with a perspective grid, orbiting rings and rotating role titles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#0b1233"/>
      <stop offset="1" stop-color="#140a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="floor"><rect x="0" y="270" width="1200" height="150"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(30px)}}
      @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
      @keyframes role{0%{opacity:0}4%{opacity:1}22%{opacity:1}26%{opacity:0}100%{opacity:0}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .grid{animation:scroll 1.2s linear infinite}
      .star{animation:twinkle 3s ease-in-out infinite}
      .r{opacity:0;animation:role 12s linear infinite}
      .cursor{animation:blink 1s steps(1) infinite}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="star" cx="90" cy="60" r="1.6"/>
    <circle class="star" style="animation-delay:.7s" cx="220" cy="130" r="1.2"/>
    <circle class="star" style="animation-delay:1.4s" cx="340" cy="40" r="1.4"/>
    <circle class="star" style="animation-delay:2.1s" cx="470" cy="95" r="1"/>
    <circle class="star" style="animation-delay:.3s" cx="760" cy="48" r="1.5"/>
    <circle class="star" style="animation-delay:1.1s" cx="900" cy="120" r="1.2"/>
    <circle class="star" style="animation-delay:1.8s" cx="1040" cy="58" r="1.6"/>
    <circle class="star" style="animation-delay:2.5s" cx="1130" cy="140" r="1.1"/>
  </g>

  <!-- perspective floor grid -->
  <g clip-path="url(#floor)">
    <g stroke="#38bdf8" stroke-opacity=".45" stroke-width="1" fill="none">
      <line x1="600" y1="270" x2="-600" y2="420"/>
      <line x1="600" y1="270" x2="-300" y2="420"/>
      <line x1="600" y1="270" x2="0" y2="420"/>
      <line x1="600" y1="270" x2="300" y2="420"/>
      <line x1="600" y1="270" x2="600" y2="420"/>
      <line x1="600" y1="270" x2="900" y2="420"/>
      <line x1="600" y1="270" x2="1200" y2="420"/>
      <line x1="600" y1="270" x2="1500" y2="420"/>
      <line x1="600" y1="270" x2="1800" y2="420"/>
      <g class="grid">
        <line x1="0" y1="262" x2="1200" y2="262"/>
        <line x1="0" y1="275" x2="1200" y2="275"/>
        <line x1="0" y1="292" x2="1200" y2="292"/>
        <line x1="0" y1="314" x2="1200" y2="314"/>
        <line x1="0" y1="342" x2="1200" y2="342"/>
        <line x1="0" y1="378" x2="1200" y2="378"/>
        <line x1="0" y1="420" x2="1200" y2="420"/>
      </g>
    </g>
    <rect x="0" y="270" width="1200" height="150" fill="url(#floorFade)"/>
  </g>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#38bdf8" stroke-opacity=".7"/>

  <!-- orbiting rings (left: electronics, right: infrastructure) -->
  <g transform="translate(150 150)">
    <circle r="90" fill="url(#glow)"/>
    <ellipse rx="70" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="70" ry="24" fill="none" stroke="#a78bfa" stroke-width="1.6" transform="rotate(60)">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="70" ry="24" fill="none" stroke="#f472b6" stroke-width="1.6" transform="rotate(120)">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="9" fill="#38bdf8"><animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/></circle>
    <text class="mono" y="4" font-size="9" fill="#050816" text-anchor="middle" font-weight="700">Ω</text>
  </g>

  <g transform="translate(1050 150)">
    <circle r="90" fill="url(#glow)"/>
    <g>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <circle r="7" fill="#a78bfa"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="mono" y="3.5" font-size="8" fill="#050816" text-anchor="middle" font-weight="700">K8s</text>
  </g>

  <!-- name -->
  <text class="sans" x="600" y="150" font-size="62" font-weight="800" text-anchor="middle" fill="url(#name)" letter-spacing="1">VINOD RAVINDU PERERA</text>
  <text class="mono" x="600" y="190" font-size="17" text-anchor="middle" fill="#94a3b8" letter-spacing="3">SITE RELIABILITY  ×  ELECTRICAL &amp; ELECTRONIC ENGINEERING</text>

  <!-- rotating roles -->
  <g class="mono" font-size="24" text-anchor="middle" fill="#e2e8f0">
    <text class="r" x="600" y="244" style="animation-delay:0s">&gt; keeping systems up, on every layer<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text class="r" x="600" y="244" style="animation-delay:3s">&gt; multi-cluster Kubernetes failover<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text class="r" x="600" y="244" style="animation-delay:6s">&gt; ESP32 firmware &amp; IoT telemetry<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    <text class="r" x="600" y="244" style="animation-delay:9s">&gt; open-source contributor · WSO2<tspan class="cursor" fill="#38bdf8">_</tspan></text>
  </g>
</svg>

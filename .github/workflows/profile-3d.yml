name: Generate profile animations

on:
  schedule:
    - cron: "0 18 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution skyline (rotating isometric city of your commits)
      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Perera1325

      # Contribution "snake" that eats your commit graph
      - name: Snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Perera1325
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Collect generated files
        run: |
          mkdir -p assets/generated
          cp -r profile-3d-contrib/* assets/generated/ || true
          cp dist/snake*.svg assets/generated/ || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh profile animations"
          git push
